<!DOCTYPE html>
<head>
  <title>Oak</title>
  <script src="mainScript.js" defer></script>
  <link rel="stylesheet" href="mainStyle.css">
</head>
<body>
  <div class="heading">
    <h2>Oak</h2>
    <h3>The 20-line programming language</h3>
    <div id="logIN" style="top:0; right:0;">
      <b id="userName" onclick="signIn()">Sign in</b>
    </div>
    <button onclick="tutorial()">Example code in oak</button>
  </div>
  <span id="main_content" class="ggh">
    <table>
      <tr>
        <td colspan="2">
          <p style="color: white;">Visit the <a href="news.html">docs</a> page for tutorials, extentions, and news.</p>
        </td>
      </tr>
      <tr>
        <td>
          <textarea id="input" class="code" style="width: 350px; height: 130px;" maxlength="650">Insert code here.</textarea>
        </td>
        <td>
          <div class="out">
            <div style="background-color: #3b3b3b; width:350px; height: 250px">
              <div style="background-color: #ffffff; width: 350px; height: 30px">
                <button onclick="run()">Run code</button>
                <button onclick="save()">Save</button>
                <button onclick="load()">Load</button>
              </div>
              <div class="Ocont">
                <b>------------CONSOLE------------</b>
                <p id="errors" style="color: #ba1e2b;" onclick="goAwayError()" class="errors"></p>
                <p id="output"></p>
              </div>
              <div class="window" id="window">
                <div id="blockA" style="display: none;" class="redblock"></div>
                <div id="moveMP" class="mp">
                  <table>
                    <tr>
                      <td> </td>
                      <td class="smalltext">^</td>
                      <td> </td>
                    </tr>
                    <tr>
                      <td> < </td>
                      <td> </td>
                      <td> > </td>
                    </tr>
                  </table>
                </div>
              </div>
              <div class="windowUI" id="UIwindow">
                <b id="titleA">//no title</b>
                <button id="buttonA" class="Bwin" onclick="clicked()">//no title</button>
              </div>
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td colspan="2">
          <div id="oakAlienM">
            <img src="oakieM.png" onclick="gotonews()">
          </div>
        </td>
      </tr>
    </table>
  </span>
</body>
